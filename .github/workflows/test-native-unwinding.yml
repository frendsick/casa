name: Native unwinding tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  native-unwinding:
    name: GDB unwinding
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Install debugger
      run: |
        sudo apt-get update
        sudo apt-get install -y gdb
    - name: Download release tools
      run: ./install.sh
    - name: Bootstrap compiler from branch
      run: ./casac -L lib casa.casa -o casac-stage1
    - name: Check native backtraces
      run: python3 tests/test_native_unwinding.py ./casac-stage1
