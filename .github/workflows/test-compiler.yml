name: Compiler tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Load Casa release tag
      run: |
        set -euo pipefail
        release_line=$(grep -E '^CASAC_RELEASE_TAG=' casa-release.env || true)
        line_count=$(printf '%s\n' "$release_line" | grep -c '^CASAC_RELEASE_TAG=' || true)
        if [ "$line_count" -ne 1 ]; then
          echo "casa-release.env must contain exactly one CASAC_RELEASE_TAG entry" >&2
          exit 1
        fi
        CASAC_RELEASE_TAG=${release_line#CASAC_RELEASE_TAG=}
        if ! printf '%s\n' "$CASAC_RELEASE_TAG" | grep -Eq '^[A-Za-z0-9._-]+$'; then
          echo "CASAC_RELEASE_TAG contains unsupported characters: ${CASAC_RELEASE_TAG}" >&2
          exit 1
        fi
        if ! printf '%s\n' "$CASAC_RELEASE_TAG" | grep -Eq '^v[0-9]+[.][0-9]+[.][0-9]+([.-][A-Za-z0-9._-]+)?$'; then
          echo "CASAC_RELEASE_TAG must look like a Casa release tag: ${CASAC_RELEASE_TAG}" >&2
          exit 1
        fi
        printf 'CASAC_RELEASE_TAG=%s\n' "$CASAC_RELEASE_TAG" >> "$GITHUB_ENV"
    - name: Download casac release binary
      run: |
        curl --silent --location --fail \
          --output casac-release \
          "https://github.com/frendsick/casa/releases/download/${CASAC_RELEASE_TAG}/casac"
        chmod +x casac-release
    - name: Bootstrap stage1 compiler from branch
      run: ./casac-release -L lib casa.casa -o casac-stage1
    - name: Upload stage1 compiler
      uses: actions/upload-artifact@v7
      with:
        name: casac-stage1
        path: casac-stage1
        retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-latest
    env:
      CASA_COMPILER: ./casac-stage1
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: "Compiler: parsing"
          command: ./tests/test_all.sh compiler_parsing
        - name: "Compiler: analysis"
          command: ./tests/test_all.sh compiler_analysis
        - name: "Compiler: integration"
          command: ./tests/test_all.sh compiler_integration
        - name: "Types: ownership"
          command: ./tests/test_all.sh types_ownership
        - name: "Types: generics"
          command: ./tests/test_all.sh types_generics
        - name: "Types: traits"
          command: ./tests/test_all.sh types_traits
        - name: "Language: memory"
          command: ./tests/test_all.sh language_memory
        - name: "Language: control flow"
          command: ./tests/test_all.sh language_control_flow
        - name: "Language: values"
          command: ./tests/test_all.sh language_values
        - name: Runtime library
          command: ./tests/test_all.sh runtime
        - name: CLI tests
          command: ./tests/test_all.sh cli
        - name: Example tests
          command: ./tests/test_all.sh examples
        - name: Bootstrap tests
          command: ./tests/test_all.sh bootstrap
        - name: Formatter tests
          command: ./tests/test_all.sh formatter
    name: ${{ matrix.name }}
    steps:
    - uses: actions/checkout@v5
    - name: Download stage1 compiler
      uses: actions/download-artifact@v8
      with:
        name: casac-stage1
    - name: Restore stage1 compiler permissions
      run: chmod +x casac-stage1
    - name: Run ${{ matrix.name }}
      run: ${{ matrix.command }}
