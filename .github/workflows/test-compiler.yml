name: Compiler tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Load Casa release tag
      run: |
        set -euo pipefail
        release_line=$(grep -E '^CASAC_RELEASE_TAG=' casa-release.env || true)
        line_count=$(printf '%s\n' "$release_line" | grep -c '^CASAC_RELEASE_TAG=' || true)
        if [ "$line_count" -ne 1 ]; then
          echo "casa-release.env must contain exactly one CASAC_RELEASE_TAG entry" >&2
          exit 1
        fi
        CASAC_RELEASE_TAG=${release_line#CASAC_RELEASE_TAG=}
        if ! printf '%s\n' "$CASAC_RELEASE_TAG" | grep -Eq '^[A-Za-z0-9._-]+$'; then
          echo "CASAC_RELEASE_TAG contains unsupported characters: ${CASAC_RELEASE_TAG}" >&2
          exit 1
        fi
        if ! printf '%s\n' "$CASAC_RELEASE_TAG" | grep -Eq '^v[0-9]+[.][0-9]+[.][0-9]+([.-][A-Za-z0-9._-]+)?$'; then
          echo "CASAC_RELEASE_TAG must look like a Casa release tag: ${CASAC_RELEASE_TAG}" >&2
          exit 1
        fi
        printf 'CASAC_RELEASE_TAG=%s\n' "$CASAC_RELEASE_TAG" >> "$GITHUB_ENV"
    - name: Download casac release binary
      run: |
        curl --silent --location --fail \
          --output casac-release \
          "https://github.com/frendsick/casa/releases/download/${CASAC_RELEASE_TAG}/casac"
        chmod +x casac-release
    - name: Bootstrap stage1 compiler from branch
      run: ./casac-release -L lib casa.casa -o casac-stage1
    - name: Upload stage1 compiler
      uses: actions/upload-artifact@v7
      with:
        name: casac-stage1
        path: casac-stage1
        retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-latest
    env:
      CASA_COMPILER: ./casac-stage1
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: Compiler internals and diagnostics
          command: CASA_TEST_CATEGORY=internals ./tests/test_compiler.sh
        - name: Type system and ownership
          command: CASA_TEST_CATEGORY=types ./tests/test_compiler.sh
        - name: Language features and code generation
          command: CASA_TEST_CATEGORY=language ./tests/test_compiler.sh
        - name: Standard library and runtime
          command: CASA_TEST_CATEGORY=runtime ./tests/test_compiler.sh
        - name: CLI tests
          command: ./tests/test_cli.sh
        - name: Example tests
          command: ./tests/test_examples.sh
        - name: Bootstrap tests
          command: ./tests/test_bootstrap.sh
        - name: Formatter tests
          command: ./tests/test_formatter.sh
          formatter: true
    name: ${{ matrix.name }}
    steps:
    - uses: actions/checkout@v5
    - name: Download stage1 compiler
      uses: actions/download-artifact@v8
      with:
        name: casac-stage1
    - name: Restore stage1 compiler permissions
      run: chmod +x casac-stage1
    - name: Build current formatter
      if: matrix.formatter
      run: ./casac-stage1 -L lib formatter/format.casa -o casafmt
    - name: Run ${{ matrix.name }}
      run: ${{ matrix.command }}
