name: Publish compiler release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Embed release version
        run: |
          version=${GITHUB_REF_NAME#v}
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Invalid Casa release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          sed -i "s/^pub const CASAC_VERSION .*/pub const CASAC_VERSION \"$version\"/" casa.casa
      - name: Download bootstrap compiler
        run: |
          release_tag=$(sed -n 's/^CASAC_RELEASE_TAG=//p' casa-release.env)
          curl --fail --location --output casac-bootstrap \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${release_tag}/casac"
          chmod +x casac-bootstrap
      - name: Build and verify compiler
        run: |
          ./casac-bootstrap -L lib casa.casa -o casac
          test "$(./casac --version)" = "casac $GITHUB_REF_NAME"
      - name: Upload compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" casac --clobber
